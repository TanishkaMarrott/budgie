[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "budgie-firewall"
version = "0.1.0"
description = "A spend firewall for AI agents — prices a cloud command before it runs and blocks the over-budget ones."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tanishka Marrott" }]
keywords = ["ai-agents", "claude-code", "finops", "cost", "guardrail", "aws", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []  # zero-dep core: parse + price + gate is pure stdlib

[project.optional-dependencies]
aws = ["boto3>=1.34"]  # only for live AWS Price List pricing (BUDGIE_PRICING=aws)

[project.scripts]
budgie = "budgie.cli:main"

[project.urls]
Homepage = "https://github.com/TanishkaMarrott/budgie"
Repository = "https://github.com/TanishkaMarrott/budgie"
Issues = "https://github.com/TanishkaMarrott/budgie/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/budgie"]
